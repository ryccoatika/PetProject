name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  check:
    name: Lint and build
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # swift-format ships with the toolchain, so there is nothing to install.
      # Run `xcrun swift-format format -i -r MacApp/Sources/Pet` to fix findings.
      - name: Lint
        run: |
          xcrun swift-format lint --strict --recursive \
            --configuration MacApp/.swift-format MacApp/Sources/Pet

      - name: Build
        working-directory: MacApp
        run: ./build.sh --no-install

      # The generated files are committed so the Swift package builds without a
      # code generation step; a stale one would mean the binary and the sources
      # disagree.
      - name: Generated files are current
        working-directory: MacApp
        run: |
          git diff --exit-code Sources/Pet/Generated \
            || { echo "a generated file is stale — run ./build.sh and commit the result"; exit 1; }
