name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. pet skin dog
        2. Drag it to the second display
        3. ...
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: Output of `pet status` and `pet plugin status`
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.3, M2 Air"
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Which agent, if it is involved?
      options: [Not agent related, Claude Code, Codex, Gemini CLI, opencode, Several]
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A screen recording helps a lot for anything visual.
